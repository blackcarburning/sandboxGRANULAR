<!doctype html>
<html lang="en">
<head>
  <base href="/mygrain-bastardloops/">
  <meta charset="utf-8">
  <script>
    // Reuse the parent account guard; resolve relative URLs against this browser's base.
    // The guard pins requests to the logged-in workspace and cancels them on account changes.
    if (window.parent !== window && window.parent.location.origin === location.origin) {
      const accountFetch = window.parent.fetch.bind(window.parent);
      window.fetch = (input, options) => accountFetch(new URL(input, document.baseURI).href, options);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MYGRAIN Bastardloop Browser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #111826;
      --text: #e9eef7;
      --muted: #93a4bf;
      --accent: #67d6ff;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #162131 0, var(--bg) 55%);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 68ch;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      max-width: 100%;
    }

    input { min-width: 0; max-width: 100%; }
    button:disabled { opacity: 0.45; cursor: default; }

    input, button {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, rgba(103, 214, 255, 0.18), rgba(124, 255, 192, 0.14));
    }

    button:hover, a.download:hover {
      border-color: rgba(103, 214, 255, 0.35);
    }

    .stats {
      margin: 18px 0 14px;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      gap: 6px;
    }

    .card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      background: linear-gradient(180deg, rgba(17, 24, 38, 0.98), rgba(14, 20, 32, 0.98));
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .card-head {
      min-width: 0;
    }

    .name {
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
      margin-top: 4px;
    }

    .preview {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      background: var(--panel);
    }

    .pagination { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0; }
    #status { overflow-wrap: anywhere; }
    @media (max-width: 480px) { .wrap { padding: 14px; } h1 { font-size: 24px; } }

    audio {
      width: 100%;
      margin: 10px 0 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    a.download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    button.danger {
      background: linear-gradient(135deg, rgba(255, 92, 92, 0.2), rgba(255, 255, 255, 0.04));
    }

    .empty {
      color: var(--muted);
      padding: 20px 0;
    }

    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>MYGRAIN Bastardloop Browser</h1>
        <p class="subtitle">Browse filenames first. Load one preview when needed; no audio is requested until you choose Load. Files are listed alphabetically.</p>
      </div>
      <div class="controls">
        <input id="filter" type="search" aria-label="Search all Bastardloop filenames" placeholder="Search all files" maxlength="256" autocapitalize="off" autocomplete="off" spellcheck="false">
        <button id="refresh">Refresh</button>
      </div>
    </div>

    <div class="stats" id="stats" role="status">Loading filenames…</div>
    <div class="stats" id="status" role="status"></div>
    <section class="preview" id="preview" aria-label="Selected loop preview" hidden></section>
    <div class="grid" id="grid" aria-label="Bastardloop files"></div>
    <nav class="pagination" aria-label="File list pages">
      <button id="previous" type="button" disabled>Previous</button>
      <span id="pageLabel">Page 1</span>
      <button id="next" type="button" disabled>Next</button>
    </nav>
    <div class="footer">Build <strong>v2026.10.14.LoopBrowser.1</strong> · 50 filenames per page · Saved song audio is stored separately.</div>
  </div>

  <script>
    const stats = document.getElementById('stats');
    const statusLine = document.getElementById('status');
    const grid = document.getElementById('grid');
    const filterInput = document.getElementById('filter');
    const preview = document.getElementById('preview');
    const previousButton = document.getElementById('previous');
    const nextButton = document.getElementById('next');
    const pageLabel = document.getElementById('pageLabel');
    const PAGE_SIZE = 50;
    let files = [];
    let offset = 0;
    let total = 0;
    let repositoryTotal = 0;
    let loading = false;
    let requestController = null;
    let requestId = 0;
    let searchTimer = null;

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes)) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(value >= 10 || unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      return new Date(timestamp * 1000).toLocaleString();
    }

    function closePreview() {
      const audio = preview.querySelector('audio');
      if (audio) {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        if (statusLine.textContent.startsWith('Loaded preview:')) statusLine.textContent = '';
      }
      preview.replaceChildren();
      preview.hidden = true;
    }

    function accountMediaUrl(value) {
      const url = new URL(value, document.baseURI);
      const username = window.parent?.mygrainAccountContext?.user?.username;
      if (url.origin !== location.origin) throw new Error('Unexpected repository URL.');
      if (username) url.searchParams.set('mygrainUser', username);
      return url.href;
    }

    function loadPreview(file) {
      closePreview();
      preview.hidden = false;
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = file.name;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${formatBytes(file.size)} • ${formatTime(file.modified)}`;

        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = accountMediaUrl(file.url);
        audio.addEventListener('error', () => {
          statusLine.textContent = `Could not load ${file.name}. Refresh the list or try Load again.`;
        });

        const actions = document.createElement('div');
        actions.className = 'actions';

        const download = document.createElement('a');
        download.className = 'download';
        download.href = accountMediaUrl(file.url);
        download.download = '';
        download.textContent = 'Download';

        const cardActions = document.createElement('div');
        cardActions.className = 'card-actions';

        const renameButton = document.createElement('button');
        renameButton.type = 'button';
        renameButton.textContent = 'Rename';

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.textContent = 'Delete';
        deleteButton.classList.add('danger');
        const closeButton = document.createElement('button');
        closeButton.type = 'button';
        closeButton.textContent = 'Close preview';
        closeButton.addEventListener('click', closePreview);

        renameButton.addEventListener('click', async () => {
          const nextName = prompt('Rename this Bastardloop to:', file.name.replace(/\.wav$/i, ''));
          if (!nextName) return;
          renameButton.disabled = true;
          deleteButton.disabled = true;
          statusLine.textContent = `Renaming ${file.name}…`;
          try {
            const response = await fetch('./api/rename', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ from: file.name, to: nextName })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.ok) {
              throw new Error(payload.error || `Rename failed with status ${response.status}`);
            }
            statusLine.textContent = `Renamed to ${payload.savedName || nextName}.`;
            await loadFiles();
          } catch (error) {
            console.error(error);
            statusLine.textContent = `Rename failed: ${error.message}`;
          } finally {
            renameButton.disabled = false;
            deleteButton.disabled = false;
          }
        });

        deleteButton.addEventListener('click', async () => {
          if (!confirm(`Delete ${file.name}?`)) return;
          renameButton.disabled = true;
          deleteButton.disabled = true;
          statusLine.textContent = `Deleting ${file.name}…`;
          try {
            const response = await fetch(`./api/delete?filename=${encodeURIComponent(file.name)}`, {
              method: 'DELETE'
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.ok) {
              throw new Error(payload.error || `Delete failed with status ${response.status}`);
            }
            statusLine.textContent = `Deleted ${payload.deletedName || file.name}.`;
            await loadFiles();
          } catch (error) {
            console.error(error);
            statusLine.textContent = `Delete failed: ${error.message}`;
          } finally {
            renameButton.disabled = false;
            deleteButton.disabled = false;
          }
        });

        cardActions.append(renameButton, deleteButton, closeButton);
        actions.append(download, cardActions);
        preview.append(name, meta, audio, actions);
        audio.load();
        preview.scrollIntoView({ block: 'nearest' });
        statusLine.textContent = `Loaded preview: ${file.name}. Press Play to audition; this does not replace any MYGRAIN card.`;
    }

    function render() {
      grid.replaceChildren();
      previousButton.disabled = loading || offset === 0;
      nextButton.disabled = loading || offset + PAGE_SIZE >= total;
      pageLabel.textContent = `Page ${Math.floor(offset / PAGE_SIZE) + 1} of ${Math.max(1, Math.ceil(total / PAGE_SIZE))}`;
      if (loading) return;
      stats.textContent = total
        ? `${offset + 1}–${offset + files.length} of ${total} matching files (${repositoryTotal} stored). Audio loads only on request.`
        : `No matching files (${repositoryTotal} stored).`;
      files.forEach((file) => {
        const card = document.createElement('article');
        card.className = 'card';
        const head = document.createElement('div');
        head.className = 'card-head';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = file.name;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${formatBytes(file.size)} • ${formatTime(file.modified)}`;
        const loadButton = document.createElement('button');
        loadButton.type = 'button';
        loadButton.textContent = 'Load';
        loadButton.setAttribute('aria-label', `Load preview: ${file.name}`);
        loadButton.addEventListener('click', () => loadPreview(file));
        head.append(name, meta);
        card.append(head, loadButton);
        grid.appendChild(card);
      });
    }

    async function loadFiles() {
      clearTimeout(searchTimer);
      requestController?.abort();
      const controller = new AbortController();
      requestController = controller;
      const currentId = ++requestId;
      const timeout = setTimeout(() => controller.abort(), 20000);
      closePreview();
      loading = true;
      stats.textContent = 'Loading filenames…';
      render();
      try {
        const query = new URLSearchParams({ limit: PAGE_SIZE, offset, q: filterInput.value.trim() });
        const response = await fetch(`./api/list?${query}`, { cache: 'no-store', signal: controller.signal });
        const payload = await response.json();
        if (currentId !== requestId) return;
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || `Could not load repository (${response.status})`);
        }
        files = payload.files || [];
        offset = payload.offset;
        total = payload.total;
        repositoryTotal = payload.repositoryTotal;
        loading = false;
        render();
      } catch (error) {
        if (currentId !== requestId) return;
        stats.textContent = error.name === 'AbortError'
          ? 'Filename list timed out. Press Refresh to try again.'
          : `Repository load failed: ${error.message}`;
        grid.replaceChildren();
        previousButton.disabled = true;
        nextButton.disabled = true;
      } finally {
        clearTimeout(timeout);
        if (currentId === requestId) loading = false;
      }
    }

    document.getElementById('refresh').addEventListener('click', loadFiles);
    previousButton.addEventListener('click', () => {
      offset = Math.max(0, offset - PAGE_SIZE);
      loadFiles();
    });
    nextButton.addEventListener('click', () => {
      offset += PAGE_SIZE;
      loadFiles();
    });
    filterInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      requestController?.abort();
      requestId += 1;
      offset = 0;
      loading = true;
      closePreview();
      stats.textContent = 'Searching filenames…';
      render();
      searchTimer = setTimeout(loadFiles, 200);
    });
    window.addEventListener('pagehide', () => {
      clearTimeout(searchTimer);
      requestId += 1;
      requestController?.abort();
      closePreview();
    });
    loadFiles();
  </script>
</body>
</html>
